apiVersion: apps/v1
kind: Deployment
metadata:
  name: themovie-app
  labels:
    app: themovie-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: themovie-app
  template:
    metadata:
      labels:
        app: themovie-app
    spec:
      containers:
        - name: themovie-app
          image: mariamussi/themovie-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              # porta padrao do nginx
              containerPort: 80 
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: themovie-app-nodeport
spec:
  type: NodePort
  selector:
    app: themovie-app
  ports:
    - name: http
      port: 80
      targetPort: http
